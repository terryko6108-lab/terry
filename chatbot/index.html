<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terry 챗봇</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2129; --muted: #6b7280;
      --border: #e3e6ea; --user: #2563eb; --user-text: #ffffff; --bot: #eef1f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --panel: #1a1d24; --text: #e6e8eb; --muted: #9aa1ab;
        --border: #2a2f38; --user: #3b82f6; --user-text: #ffffff; --bot: #242833;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      height: 100dvh; display: flex; flex-direction: column;
    }
    header {
      padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 17px; margin: 0; }
    header button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
    }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .assistant.pending::after { content: "▍"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form {
      display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
      background: var(--panel);
    }
    form > div { display: flex; gap: 8px; max-width: 760px; width: 100%; margin: 0 auto; }
    textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; font: inherit; background: var(--bg); color: var(--text);
      max-height: 160px;
    }
    textarea:focus { outline: 2px solid var(--user); outline-offset: -1px; }
    form button {
      border: none; border-radius: 12px; padding: 0 18px; background: var(--user);
      color: var(--user-text); font: inherit; font-weight: 600; cursor: pointer;
    }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Terry 챗봇</h1>
    <button id="reset" type="button">새 대화</button>
  </header>
  <main id="log"><p class="empty">무엇이든 물어보세요.</p></main>
  <form id="form">
    <div>
      <textarea id="input" rows="1" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
      <button id="send" type="submit">전송</button>
    </div>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = [];  // [{role: "user"|"assistant", content: string}]

    function addBubble(role, text) {
      log.querySelector(".empty")?.remove();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function ask(text) {
      history.push({ role: "user", content: text });
      addBubble("user", text);
      const bubble = addBubble("assistant", "");
      bubble.classList.add("pending");
      send.disabled = true;

      let reply = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          reply += decoder.decode(value, { stream: true });
          bubble.textContent = reply;
          log.scrollTop = log.scrollHeight;
        }
        if (!res.ok) throw new Error(reply);
      } catch (err) {
        reply = "";
        bubble.textContent = "⚠️ 서버와 통신하지 못했습니다. server.py가 실행 중인지 확인하세요.";
      } finally {
        bubble.classList.remove("pending");
        send.disabled = false;
        input.focus();
      }
      // 오류 메시지는 대화 기록에 남기지 않는다.
      if (reply && !reply.startsWith("⚠️")) {
        history.push({ role: "assistant", content: reply });
      } else {
        history.pop();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = "";
      input.style.height = "auto";
      ask(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      log.innerHTML = '<p class="empty">무엇이든 물어보세요.</p>';
      input.focus();
    });
  </script>
</body>
</html>
